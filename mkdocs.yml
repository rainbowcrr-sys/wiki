site_name: Rainbow Tech Wiki
site_url: https://rainbowcrr-sys.github.io/wiki/
site_description: Personal technology knowledge base
site_author: rainbowcrr-sys
repo_url: https://github.com/rainbowcrr-sys/wiki

theme:
  name: material
  language: en
  # ---- 调色板：定义亮色和暗色两套主题 ----
  palette:
    # 亮色主题（默认）
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night   # 亮色时显示"月亮"图标
        name: Switch to dark mode
    # 暗色主题
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny   # 暗色时显示"太阳"图标
        name: Switch to light mode
  # ---- 功能开关 ----
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - attr_list
