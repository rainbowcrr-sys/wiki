site_name: Rainbow Tech Wiki
site_url: https://rainbowcrr-sys.github.io/wiki/
site_description: Personal technology knowledge base
site_author: rainbowcrr-sys
repo_url: https://github.com/rainbowcrr-sys/wiki

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
    - header.autohide

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - attr_list

extra:                        # ← 这是新加的
  analytics:
    provider: google
    property: G-C46XN2TYQC
