name: Update Manifest

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check if articles changed
        id: check
        run: |
          # 检查最近一次提交里有没有 .html 文件变动
          if git diff --name-only HEAD~1 HEAD | grep -q '\.html$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate manifest.json
        if: steps.check.outputs.changed == 'true'
        run: python .github/scripts/generate_manifest.py

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "chore: auto-update manifest.json [skip ci]"
          git push
