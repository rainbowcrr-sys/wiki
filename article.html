<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Article · Rainbow Tech Wiki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: '#4f46e5' } } } }</script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C46XN2TYQC"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-C46XN2TYQC');</script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen">
  <header class="border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="font-bold text-brand">← Back to Wiki</a>
      <button id="themeToggle" class="p-2 rounded hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Toggle theme">
        <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
      </button>
    </div>
  </header>
  <div class="max-w-6xl mx-auto px-4 py-8 flex gap-8">
    <main class="flex-1 min-w-0">
      <div id="articleBody" class="prose dark:prose-invert max-w-none">Loading…</div>
    </main>
    <aside id="tocSidebar" class="w-64 shrink-0">
      <div class="sticky top-8">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wide">On this page</h3>
          <button id="tocToggle" class="p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-800" title="Toggle sidebar" aria-label="Toggle table of contents">
            <span class="material-symbols-outlined text-sm" id="tocToggleIcon">chevron_right</span>
          </button>
        </div>
        <nav id="tocNav" class="space-y-1 text-sm"></nav>
      </div>
    </aside>
  </div>
  <script src="js/theme.js"></script>
  <script src="js/toc.js"></script>
  <script src="js/components.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var article = params.get('a') || 'programming/material-symbols';
    fetch('articles/' + article + '.html')
      .then(function(r){ if(!r.ok) throw new Error(); return r.text(); })
      .then(function(html){
        document.getElementById('articleBody').innerHTML = html;
        var h1 = document.querySelector('#articleBody h1');
        if(h1) document.getElementById('pageTitle').textContent = h1.textContent + ' · Rainbow Tech Wiki';
        if(window.generateTOC) window.generateTOC();
        requestAnimationFrame(function(){ if(window.initComponents) window.initComponents(document.getElementById('articleBody')); });
      })
      .catch(function(){ document.getElementById('articleBody').innerHTML = '<p>Article not found.</p>'; });
  </script>
</body>
</html>
