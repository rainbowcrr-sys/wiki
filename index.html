<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainbow Tech Wiki</title>
  <meta name="description" content="Personal technology knowledge base">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: '#4f46e5' } } } }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C46XN2TYQC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date()); gtag('config', 'G-C46XN2TYQC');
  </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen">
  <header class="border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="font-bold text-lg text-brand">Rainbow Tech Wiki</a>
      <div class="flex items-center gap-3">
        <input id="searchInput" type="search" placeholder="Search..."
          class="hidden sm:block px-3 py-1.5 rounded border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-brand">
        <button id="themeToggle" title="Toggle dark mode"
          class="p-2 rounded hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Toggle theme">
          <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
        </button>
      </div>
    </div>
    <div id="searchResults" class="hidden max-w-4xl mx-auto px-4 pb-3"></div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <p class="text-slate-600 dark:text-slate-400 mb-6">Personal knowledge base for programming, AI, Linux, and tools.</p>
    <h2 class="text-xl font-semibold mb-4">Explore</h2>
    <div id="categoryGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    <h2 class="text-xl font-semibold mt-10 mb-4">Latest</h2>
    <ul id="latestList" class="space-y-2 list-disc list-inside"></ul>
  </main>

  <footer class="border-t border-slate-200 dark:border-slate-800 mt-12">
    <div class="max-w-4xl mx-auto px-4 py-6 text-sm text-slate-500">Made with HTML/JS/CSS · Hosted on GitHub Pages</div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
